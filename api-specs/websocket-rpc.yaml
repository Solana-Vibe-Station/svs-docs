openapi: 3.0.3
info:
  title: Solana Vibe Station WebSocket RPC
  description: |
    Solana JSON-RPC 2.0 methods invoked over a WebSocket connection.

    Connect to a `wss://` server URL and exchange JSON-RPC envelopes
    over the resulting socket. Subscribe methods return an integer
    subscription id; the server then pushes notification messages
    on the same socket. Unsubscribe with the matching unsubscribe
    method.

    Each method is documented as its own OpenAPI operation. The
    POST shape shown is illustrative — the request body is the
    JSON-RPC envelope you send over the WebSocket frame.
  version: 1.0.0
  contact:
    name: Solana Vibe Station
    url: https://www.solanavibestation.com
  license:
    name: MIT OR Apache-2.0
    url: https://opensource.org/licenses/MIT
servers:
- url: wss://public.rpc.solanavibestation.com
  description: Public WebSocket endpoint (rate-limited)
- url: wss://lite.rpc.solanavibestation.com
  description: Lite tier WebSocket
- url: wss://basic.rpc.solanavibestation.com
  description: Basic tier WebSocket
- url: wss://ultra.rpc.solanavibestation.com
  description: Ultra tier WebSocket
- url: wss://elite.rpc.solanavibestation.com
  description: Elite tier WebSocket
- url: wss://epic.rpc.solanavibestation.com
  description: Epic tier WebSocket
tags:
- name: Account Subscriptions
  description: Subscribe to changes to a single account.
- name: Block Subscriptions
  description: Subscribe to new blocks (currently unsupported on SVS).
- name: Logs Subscriptions
  description: Subscribe to transaction log lines.
- name: Program Subscriptions
  description: Subscribe to changes to all accounts owned by a program.
- name: Root Subscriptions
  description: Subscribe to root slot updates from the leader.
- name: Signature Subscriptions
  description: Subscribe to a single transaction signature's confirmation.
- name: Slot Subscriptions
  description: Subscribe to slot processed/confirmed/rooted notifications.
- name: Vote Subscriptions
  description: Subscribe to gossip votes (currently unsupported on SVS).
paths:
  /accountSubscribe:
    post:
      operationId: accountSubscribe
      summary: accountSubscribe — Subscribe to account changes
      tags:
      - Account Subscriptions
      description: |
        Subscribe to an account to receive notifications when the lamports or data for a given account public key changes. Returns a subscription ID that can be used to unsubscribe. This method establishes a persistent WebSocket connection that will send real-time notifications whenever the specified account's state changes on the blockchain.
        **Parameters**

        0. `pubkey` (required) — Base-58 encoded public key.
        1. `config` (optional) — Optional configuration object. Every field is optional; omit the entire object to use defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  description: JSON-RPC protocol version.
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  description: Request identifier echoed back in the response.
                  example: 1
                method:
                  type: string
                  enum:
                  - accountSubscribe
                  description: Must be `accountSubscribe`.
                  example: accountSubscribe
                params:
                  type: array
                  description: Positional parameters. Each item below corresponds to one position in the array, in order.
                  minItems: 1
                  maxItems: 2
                  items:
                    anyOf:
                    - title: pubkey
                      type: string
                      description: Base-58 encoded public key.
                      example: 83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri
                    - title: config (optional)
                      type: object
                      description: Optional configuration object. Every field is optional; omit the entire object to use defaults.
                      properties:
                        commitment:
                          $ref: '#/components/schemas/Commitment'
                        minContextSlot:
                          type: integer
                          format: int64
                          description: Minimum slot at which the request can be evaluated. The RPC node will reject the request with a `MinContextSlotNotReached` error if its current root is below this value. Use this for read-after-write consistency in multi-step workflows.
                          example: 416990000
                        encoding:
                          $ref: '#/components/schemas/Encoding'
            examples:
              default:
                summary: Standard request — required params only.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: accountSubscribe
                  params:
                  - 83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri
                  - encoding: jsonParsed
                    commitment: finalized
      responses:
        '200':
          description: Successful `accountSubscribe` response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonRpcEnvelope'
                - type: object
                  required:
                  - result
                  properties:
                    result:
                      type: integer
                      format: int64
                      description: Subscription id. Save this value to call the matching unsubscribe method later.
                      example: 24040
              example:
                jsonrpc: '2.0'
                id: 1
                result: 24040
        '401': &id001
          $ref: '#/components/responses/UnauthorizedError'
        '403': &id002
          $ref: '#/components/responses/ForbiddenError'
        '429': &id003
          $ref: '#/components/responses/TooManyRequestsError'
        '500': &id004
          $ref: '#/components/responses/InternalServerError'
