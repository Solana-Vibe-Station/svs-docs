      x-codeSamples:
      - lang: shell
        label: cURL / websocat
        source: |-
          # cURL doesn't speak WebSocket — use `websocat` (or `wscat -c`).
          # Install:  cargo install websocat   # or  npm install -g wscat
          echo '{
            "jsonrpc": "2.0",
            "id": 1,
            "method": "accountSubscribe",
            "params": [
              "83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri",
              {
                "encoding": "jsonParsed",
                "commitment": "finalized"
              }
            ]
          }' | websocat wss://public.rpc.solanavibestation.com
      - lang: python
        label: Python
        source: |-
          import json, asyncio
          import websockets  # pip install websockets

          WS_URL = "wss://public.rpc.solanavibestation.com"

          async def main():
              async with websockets.connect(WS_URL) as ws:
                  await ws.send(json.dumps({
                      "jsonrpc": "2.0", "id": 1,
                      "method": "accountSubscribe",
                      "params": ["83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri", {"encoding": "jsonParsed", "commitment": "finalized"}]
                  }))
                  # First message: subscription confirmation with the id.
                  print(json.loads(await ws.recv()))
                  # Subsequent messages: notification frames pushed by the server.
                  async for msg in ws:
                      print(json.loads(msg))
                      break  # remove to keep listening

          asyncio.run(main())
      - lang: javascript
        label: JavaScript
        source: |-
          // In Node.js: npm install ws
          // In a browser, the global WebSocket constructor is already available.
          import WebSocket from "ws";

          const ws = new WebSocket("wss://public.rpc.solanavibestation.com");

          ws.on("open", () => {
            ws.send(JSON.stringify({
              jsonrpc: "2.0", id: 1,
              method: "accountSubscribe",
              params: ["83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri", {"encoding": "jsonParsed", "commitment": "finalized"}]
            }));
          });
          ws.on("message", (data) => {
            console.log(JSON.parse(data));
          });
      - lang: rust
        label: Rust
        source: |-
          // Cargo.toml:
          //   tokio = { version = "1", features = ["full"] }
          //   tokio-tungstenite = "0.21"
          //   futures-util = "0.3"
          //   serde_json = "1"
          use futures_util::{SinkExt, StreamExt};
          use tokio_tungstenite::{connect_async, tungstenite::Message};

          #[tokio::main]
          async fn main() -> anyhow::Result<()> {
              let (mut ws, _) = connect_async("wss://public.rpc.solanavibestation.com").await?;
              let body = serde_json::json!({
                  "jsonrpc": "2.0", "id": 1,
                  "method": "accountSubscribe",
                  "params": ["83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri", {"encoding": "jsonParsed", "commitment": "finalized"}]
              });
              ws.send(Message::Text(body.to_string())).await?;
              while let Some(msg) = ws.next().await {
                  println!("{}", msg?);
              }
              Ok(())
          }
