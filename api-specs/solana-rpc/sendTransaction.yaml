          from solana.rpc.api import Client
          from solders.pubkey import Pubkey

          client = Client("https://public.rpc.solanavibestation.com")

          # Build and sign the transaction first; here we send pre-encoded bytes.
          # In real usage:  resp = client.send_transaction(my_signed_tx)
          #                 print(resp.value)
          # The example below uses send_raw_transaction with already-signed bytes.
          from solana.rpc.types import TxOpts
          raw_tx_bytes = bytes.fromhex("00")  # replace with your signed tx bytes
          resp = client.send_raw_transaction(raw_tx_bytes, opts=TxOpts(skip_preflight=False, preflight_commitment="processed"))
          print(resp.value)
