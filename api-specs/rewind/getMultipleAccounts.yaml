openapi: 3.0.3
info:
  title: 'Rewind RPC: getMultipleAccounts'
  description: |-
    Batched point-in-time historical account lookup. Returns up to `max_multi_accounts` accounts at one shared historical position. Mirrors Solana's `getMultipleAccounts`.

    Accepts the same positioning options as `getAccountInfo` — either an end-of-slot `slot: N` or a per-transaction `anchor: { signature, position }`. The resolved position is applied uniformly to every pubkey in the batch; an anchor signature is resolved exactly once.

    Response includes a hard byte cap (default 10 MiB). When the cap is reached, already-included entries remain populated and all later entries are emitted as `null`; `truncatedByBytes` is set to `true`. Resubmit the truncated tail with a smaller batch.
  version: 1.0.0
  contact:
    name: Solana Vibe Station
    url: https://www.solanavibestation.com
  license:
    name: MIT OR Apache-2.0
    url: https://opensource.org/licenses/MIT
servers:
- url: https://basic.rpc.solanavibestation.com
  description: Basic tier
- url: https://ultra.rpc.solanavibestation.com
  description: Ultra tier
- url: https://elite.rpc.solanavibestation.com
  description: Elite tier
- url: https://epic.rpc.solanavibestation.com
  description: Epic tier
tags:
- name: Rewind
  description: Historical account state and per-write change history.
paths:
  /rewind:
    post:
      operationId: getMultipleAccounts
      summary: getMultipleAccounts — Batched historical lookup at one shared boundary
      tags:
      - Rewind
      description: |
        Returns the state of multiple accounts at one shared historical position.

        **Parameters**

        0. `pubkeys` (required) — array of base58 pubkeys, length 1..=`max_multi_accounts`.
        1. `config` (required) — same shape as `getAccountInfo`'s config; one positioning mode required.

        Per-entry `rewindSlot` is independently resolved per pubkey: each entry's `rewindSlot` is the actual slot where its returned version lives (typically ≤ `context.slot`) and may differ between entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  example: 1
                method:
                  type: string
                  enum:
                  - getMultipleAccounts
                  example: getMultipleAccounts
                params:
                  type: array
                  description: Positional parameters [pubkeys, config].
                  minItems: 2
                  maxItems: 2
                  items:
                    anyOf:
                    - title: pubkeys
                      type: array
                      description: Base58 pubkeys, length 1..=`max_multi_accounts`.
                      minItems: 1
                      items:
                        type: string
                    - title: config
                      type: object
                      properties:
                        slot:
                          type: integer
                          format: int64
                          description: End-of-slot boundary. Required unless `anchor` is set.
                        anchor:
                          $ref: '#/components/schemas/Anchor'
                        encoding:
                          $ref: '#/components/schemas/Encoding'
                        dataSlice:
                          $ref: '#/components/schemas/DataSlice'
                        commitment:
                          type: string
                          description: Accepted for compatibility; ignored.
                        tolerateGaps:
                          type: boolean
                          default: false
            examples:
              end_of_slot_batch:
                summary: End-of-slot batch.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: getMultipleAccounts
                  params:
                  - - SysvarC1ock11111111111111111111111111111111
                    - <other>
                  - slot: 250000000
                    encoding: base64
              anchor_after_swap:
                summary: Three pool accounts immediately after a known swap tx — one signature lookup, three fan-out reads.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: getMultipleAccounts
                  params:
                  - - <pool>
                    - <vault_a>
                    - <vault_b>
                  - anchor:
                      signature: <swap-sig>
                      position: after
      responses:
        '200':
          description: Successful response. Some entries may be `null` (no version exists, or response byte cap hit).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonRpcEnvelope'
                - type: object
                  required:
                  - result
                  properties:
                    result:
                      type: object
                      required:
                      - context
                      - value
                      - truncatedByBytes
                      properties:
                        context:
                          $ref: '#/components/schemas/RewindContext'
                        value:
                          type: array
                          description: AccountInfo entries (or `null`) in request order. `null` indicates either "no version exists at or before the resolved boundary" or "response byte cap reached before this entry".
                          items:
                            $ref: '#/components/schemas/AccountInfo'
                        truncatedByBytes:
                          type: boolean
                          description: True if the 10 MiB response cap was reached. Resubmit the truncated tail with a smaller batch.
              example:
                jsonrpc: '2.0'
                id: 1
                result:
                  context:
                    apiVersion: rewind-1.2.0
                    slot: 250000000
                  value:
                  - lamports: 88849814690250
                    owner: '11111111111111111111111111111111'
                    data:
                    - ''
                    - base64
                    executable: false
                    rentEpoch: 361
                    space: 0
                    rewindSlot: 249999998
                  - null
                  truncatedByBytes: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: &id001
      - {}
      - AuthHeader: []
      - URLParameter: []
      x-codeSamples:
      - lang: shell
        label: cURL
        source: |-
          curl -X POST https://basic.rpc.solanavibestation.com/rewind \
            -H "Content-Type: application/json" \
            -d '{
              "jsonrpc": "2.0",
              "id": 1,
              "method": "getMultipleAccounts",
              "params": [
                [
                  "<pubkey1>",
                  "<pubkey2>"
                ],
                {
                  "slot": 250000000,
                  "encoding": "base64"
                }
              ]
            }'
      - lang: javascript
        label: JavaScript
        source: |-
          const res = await fetch("https://basic.rpc.solanavibestation.com", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "getMultipleAccounts",
              params: [
                [pool, vaultA, vaultB],
                { anchor: { signature: swapSig, position: "after" } },
              ],
            }),
          });
          const { result } = await res.json();
          for (const [i, entry] of result.value.entries()) {
            if (!entry) console.log(i, "null");
            else console.log(i, entry.rewindSlot, entry.lamports);
          }
      - lang: python
        label: Python
        source: |-
          import requests

          resp = requests.post(
              "https://basic.rpc.solanavibestation.com",
              json={
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "getMultipleAccounts",
                  "params": [
                      [pool, vault_a, vault_b],
                      {"anchor": {"signature": swap_sig, "position": "after"}},
                  ],
              },
              timeout=10,
          ).json()
          for i, entry in enumerate(resp["result"]["value"]):
              print(i, entry and entry["rewindSlot"])
components:
  schemas:
    JsonRpcEnvelope:
      type: object
      required:
      - jsonrpc
      - id
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: string
          - type: integer
    JsonRpcErrorResponse:
      type: object
      required:
      - jsonrpc
      - id
      - error
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: string
          - type: integer
        error:
          $ref: '#/components/schemas/JsonRpcError'
    JsonRpcError:
      type: object
      required:
      - code
      - message
      description: |
        Rewind-specific codes: `-32014` future, `-32015` before earliest, `-32016` signature not found, `-32018` slot in archive gap.
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    Encoding:
      type: string
      enum:
      - base64
      - base64+zstd
      - base58
      - jsonParsed
      default: base64
    DataSlice:
      type: object
      required:
      - offset
      - length
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
        length:
          type: integer
          format: int64
          minimum: 0
    Anchor:
      type: object
      required:
      - signature
      properties:
        signature:
          type: string
        position:
          type: string
          enum:
          - before
          - after
          default: before
    RewindContext:
      type: object
      required:
      - apiVersion
      - slot
      properties:
        apiVersion:
          type: string
          example: rewind-1.2.0
        slot:
          type: integer
          format: int64
    AccountInfo:
      type: object
      nullable: true
      required:
      - lamports
      - owner
      - data
      - executable
      - rentEpoch
      - space
      - rewindSlot
      properties:
        lamports:
          type: integer
          format: int64
        owner:
          type: string
        data:
          oneOf:
          - type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
          - type: object
            additionalProperties: true
        executable:
          type: boolean
        rentEpoch:
          type: integer
          format: int64
        space:
          type: integer
          format: int64
        rewindSlot:
          type: integer
          format: int64
          description: Rewind extension. Actual slot of the version returned (≤ `context.slot`). Less than `context.slot` means the value carries forward from an earlier slot.
  responses:
    UnauthorizedError:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    ForbiddenError:
      description: Insufficient permissions for the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    TooManyRequestsError:
      description: Rate limit exceeded for this tier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
  securitySchemes:
    AuthHeader:
      type: apiKey
      in: header
      name: Authorization
      description: 'Pass `Authorization: <api-key>` on each request.'
    URLParameter:
      type: apiKey
      in: query
      name: api_key
      description: Pass `?api_key=<api-key>` on the URL.
security: *id001
