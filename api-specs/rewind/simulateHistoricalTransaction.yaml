openapi: 3.0.3
info:
  title: 'Rewind RPC: simulateHistoricalTransaction'
  description: |-
    Runs a transaction against the Rewind archive's account state at a specified historical position. Mirrors Solana's `simulateTransaction` response shape, pinned to historical state.

    Use cases: post-mortem analysis, debugging failed txs against the exact pre-state they saw, deterministic-replay validation, opportunity research at known historical moments.

    **Positioning.** Two modes are supported:

    1. **`anchor` set** — the named transaction is resolved through the archive index and used as the boundary. `position: "before"` loads state the named tx itself read; `position: "after"` loads state immediately after the named tx finished writing.
    2. **`slot` only** — end-of-slot at `slot`. Use `preStateSlot` to override where account state is loaded from (e.g. `slot - 1` for "as if this tx ran at slot start"); ALTs are always resolved at `slot`.

    **Filter set.** Simulations that touch a filtered owner or pubkey are refused with `-32017 FilteredAccountStale`. See `getRewindCoverage.filteredOwners`.

    **Account overrides.** `accountOverrides` lets you swap out individual accounts for the simulation. Each entry is either *static* (you supply the bytes for hypothetical "what-if" scenarios) or *load-at* (the server reads the account from the archive at a per-account slot or transaction anchor, so you can time-shift one account relative to the rest of the simulation). See the `accountOverrides` config field below for the full schema and refusal rules.
  version: 1.0.0
  contact:
    name: Solana Vibe Station
    url: https://www.solanavibestation.com
  license:
    name: MIT OR Apache-2.0
    url: https://opensource.org/licenses/MIT
servers:
- url: https://basic.rpc.solanavibestation.com
  description: Basic tier
- url: https://ultra.rpc.solanavibestation.com
