tags:
- name: Rewind
  description: Historical transaction simulation.
paths:
  /rewind:
    post:
      operationId: simulateHistoricalTransaction
      summary: simulateHistoricalTransaction — Replay a transaction against historical state
      tags:
      - Rewind
      description: |
        Replays a transaction against the archive's account state at a specified slot. Mirrors Solana's `simulateTransaction` response shape, pinned to historical state.

        **Parameters**

        0. `transaction` (required) — base64 (default) or base58 encoded transaction.
        1. `config` (required) — see fields below. `slot` is required unless `anchor` is provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  example: 1
                method:
                  type: string
                  enum:
                  - simulateHistoricalTransaction
                  example: simulateHistoricalTransaction
                params:
                  type: array
                  description: Positional parameters [transaction, config].
                  minItems: 2
                  maxItems: 2
                  items:
                    anyOf:
                    - title: transaction
                      type: string
                      description: Encoded transaction (base64 by default; configurable via `config.encoding`).
                    - title: config
                      type: object
                      properties:
                        slot:
                          type: integer
                          format: int64
                          description: Required unless `anchor` is provided. Slot at which to load ALTs and account state.
                        anchor:
                          $ref: '#/components/schemas/Anchor'
                        preStateSlot:
                          type: integer
                          format: int64
                          description: Advanced — load non-ALT account state at this slot instead of `slot`. Common pattern `slot - 1` for "as if this tx ran at slot start". Ignored when `anchor` is set.
                        encoding:
                          type: string
                          enum:
                          - base64
                          - base58
                          default: base64
                          description: Encoding of the transaction parameter.
                        innerInstructions:
                          type: boolean
                          default: false
                        accounts:
                          type: object
                          description: Post-state of these accounts is returned in `result.value.accounts`.
                          required:
                          - encoding
                          - addresses
                          properties:
                            encoding:
                              type: string
                              enum:
                              - base64
                            addresses:
                              type: array
                              items:
                                type: string
                              description: Base58 pubkeys.
                        sigVerify:
                          type: boolean
                          description: Accepted for compatibility; ignored.
                        replaceRecentBlockhash:
                          type: boolean
                          description: Accepted for compatibility; ignored.
                        commitment:
                          type: string
                          description: Accepted for compatibility; ignored.
                        tolerateGaps:
                          type: boolean
                          default: false
                          description: When `false` (default), simulations whose resolved load slot lands inside a known MISSING/UNKNOWN gap return `-32018 SlotInArchiveGap`.
                        accountOverrides:
                          type: object
                          description: |
                            Map of base58 pubkey to override entry. Each override replaces whatever the loader would have produced for that pubkey, so overrides always win.

                            Two entry shapes are supported, discriminated by the presence of a `loadAt` field:

                            - **Static** — you supply the bytes (`lamports`, `owner`, `data`, optional `executable` and `rentEpoch`). Use to inject hypothetical state that didn't exist at any historical slot ("what if this account held X tokens?").
                            - **LoadAt** — you supply a per-account `loadAt: { slot }` or `loadAt: { anchor: { signature, position } }` and the server reads the archive's actual value at that boundary. Use to time-shift one account relative to the rest of the simulation (e.g. "use the oracle as it appeared 50 slots later").

                            **Limits and refusal rules**

                            - Maximum **64** entries per request (across both shapes).
                            - Sysvars (`Clock`, `Rent`, ...) cannot be overridden — they're reconstructed from the simulation slot. Use `preStateSlot` to shift apparent time.
                            - Address Lookup Tables cannot be overridden — override the resolved accounts instead.
                            - Static overrides of an upgradeable program's *programdata* account are rejected; override the program account itself, or use `LoadAt` on both at the same slot.
                            - LoadAt overrides that slot-shift an upgradeable program without naming a matching slot for its programdata (or vice versa) return `-32602 ProgramDataSlotMismatch`.
                            - Static-override data must decode to ≤ 10 MiB.

                            **Truth signal.** Any override that successfully applies appears in `value.rewindOverriddenAccounts`. A non-empty array means the result is hypothetical, not archive-truthful.

                            **Filter set interaction.** Static overrides for Vote/Stake accounts bypass the `-32017 FilteredAccountStale` refusal (your bytes, your truth). LoadAt overrides do not — the loader still enforces the filter set.
                          additionalProperties:
                            $ref: '#/components/schemas/AccountOverride'
            examples:
              end_of_slot:
                summary: End-of-slot simulation.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: simulateHistoricalTransaction
                  params:
                  - <base64-tx>
                  - slot: 250000000
                    encoding: base64
                    innerInstructions: true
                    accounts:
                      encoding: base64
                      addresses:
                      - <pubkey>
              anchor_before:
                summary: Anchor-positioned (just before a known signature).
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: simulateHistoricalTransaction
                  params:
                  - <base64-tx>
                  - encoding: base64
                    anchor:
                      signature: <base58-sig>
                      position: before
              static_override:
                summary: Inject hypothetical state via a static account override.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: simulateHistoricalTransaction
                  params:
                  - <base64-tx>
                  - slot: 285000000
                    encoding: base64
                    accountOverrides:
                      9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM:
                        lamports: 1000000000
                        owner: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
                        data:
                        - BASE64BYTES==
                        - base64
              mixed_overrides:
                summary: Mix static and load-at — inject one account, time-shift another.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: simulateHistoricalTransaction
                  params:
                  - <base64-tx>
                  - slot: 285000000
                    encoding: base64
                    accountOverrides:
                      9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM:
                        lamports: 1000000000
                        owner: TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA
                        data:
                        - BASE64BYTES==
                        - base64
                      OracleAcctPubkey1111111111111111111111111111:
                        loadAt:
                          slot: 285000050
              loadat_anchored:
                summary: Read an oracle "as of" right after a known refresh tx.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: simulateHistoricalTransaction
                  params:
                  - <base64-tx>
                  - slot: 285000000
                    encoding: base64
                    accountOverrides:
                      OracleAcctPubkey1111111111111111111111111111:
                        loadAt:
                          anchor:
                            signature: <base58-sig>
                            position: after
      responses:
        '200':
          description: Successful simulation. Failed transactions still return logs and `unitsConsumed`; the application-level error is reported in `result.value.err`.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonRpcEnvelope'
                - type: object
                  required:
                  - result
                  properties:
                    result:
                      type: object
                      required:
                      - context
                      - value
                      properties:
                        context:
                          $ref: '#/components/schemas/RewindContext'
                        value:
                          $ref: '#/components/schemas/SimulateValue'
              example:
                jsonrpc: '2.0'
                id: 1
                result:
                  context:
                    apiVersion: rewind-1.2.0
                    slot: 250000000
                  value:
                    err: null
                    logs:
                    - 'Program log: Instruction: Transfer'
                    accounts:
                    - lamports: 100000
                      owner: <base58>
                      data:
                      - ''
                      - base64
                      executable: false
                      rentEpoch: 361
                      space: 165
                    unitsConsumed: 3458
                    returnData: null
                    innerInstructions:
                    - index: 0
                      instructions:
                      - programIdIndex: 5
                        accounts:
                        - 1
                        - 2
                        data: <base58>
                        stackHeight: 2
                    rewindSlot: 250000000
                    rewindLoadSlot: 250000000
                    rewindOverriddenAccounts: []
                    rewindOverrideLoads: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: &id001
      - {}
      - AuthHeader: []
      - URLParameter: []
      x-codeSamples:
      - lang: shell
        label: cURL
        source: |-
          curl -X POST https://basic.rpc.solanavibestation.com/rewind \
            -H "Content-Type: application/json" \
            -d '{
              "jsonrpc": "2.0",
              "id": 1,
              "method": "simulateHistoricalTransaction",
              "params": [
                "<base64-tx>",
                {
                  "slot": 250000000,
                  "encoding": "base64",
                  "innerInstructions": true
                }
              ]
            }'
      - lang: javascript
        label: JavaScript
        source: |-
          const res = await fetch("https://basic.rpc.solanavibestation.com", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0", id: 1, method: "simulateHistoricalTransaction",
              params: [
                txBase64,
                {
                  anchor: { signature: sig, position: "before" },
                  encoding: "base64",
                  innerInstructions: true,
                  accounts: { encoding: "base64", addresses: [poolAccount] },
                },
              ],
            }),
          });
          const { result } = await res.json();
          console.log("err=", result.value.err);
          console.log("CU=", result.value.unitsConsumed);
          console.log("logs=", result.value.logs);
      - lang: python
        label: Python
        source: |-
          import requests

          resp = requests.post(
              "https://basic.rpc.solanavibestation.com",
              json={
                  "jsonrpc": "2.0", "id": 1,
                  "method": "simulateHistoricalTransaction",
                  "params": [
                      tx_base64,
                      {
                          "anchor": {"signature": sig, "position": "before"},
                          "encoding": "base64",
                          "innerInstructions": True,
                      },
                  ],
              },
              timeout=30,
          ).json()
          v = resp["result"]["value"]
          print("err=", v["err"])
          print("CU=", v["unitsConsumed"])
      - lang: rust
        label: Rust
        source: |-
          use reqwest::Client;
          use serde_json::json;

          let body = json!({
              "jsonrpc": "2.0", "id": 1,
              "method": "simulateHistoricalTransaction",
              "params": [
                  tx_base64,
                  {
                      "anchor": { "signature": sig, "position": "before" },
                      "encoding": "base64",
                      "innerInstructions": true
                  }
              ]
          });
          let resp: serde_json::Value = Client::new()
              .post("https://basic.rpc.solanavibestation.com")
              .json(&body)
              .send().await?.json().await?;
          println!("err={}", resp["result"]["value"]["err"]);
          println!("CU={}", resp["result"]["value"]["unitsConsumed"]);
components:
  schemas:
    JsonRpcEnvelope:
      type: object
      required:
      - jsonrpc
      - id
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: string
          - type: integer
    JsonRpcErrorResponse:
      type: object
      required:
      - jsonrpc
      - id
      - error
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: string
          - type: integer
        error:
          $ref: '#/components/schemas/JsonRpcError'
    JsonRpcError:
      type: object
      required:
      - code
      - message
      description: |
        Method-specific codes:
        - `-32014` `slot` past the archive's `latestSlot`.
        - `-32015` `slot` older than the archive's `earliestSlot`.
        - `-32016` `anchor.signature` (or `accountOverrides[].loadAt.anchor.signature`) not indexed in the archive.
        - `-32017` FilteredAccountStale — tx touches an account in the filter set (does not apply to `Static` overrides).
        - `-32018` SlotInArchiveGap — resolved load slot inside a known MISSING/UNKNOWN gap. For `LoadAt` overrides this is enforced per-entry, subject to the request-level `tolerateGaps`.
        - `-32602` Invalid params. For `accountOverrides`, includes: bad pubkey or encoding, oversize `data`, more than 64 entries, sysvar / ALT / discovered-programdata target, malformed `loadAt`, or `ProgramDataSlotMismatch` (a `LoadAt` slot-shifted a program without naming a matching slot for its programdata, or vice versa — the error message names both pubkeys).
        - `-32603` Internal error. Treat as transient; safe to retry.
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    Anchor:
      type: object
      required:
      - signature
      properties:
        signature:
          type: string
          description: Base58 transaction signature. The slot is derived automatically from the archive.
        position:
          type: string
          enum:
          - before
          - after
          default: before
    AccountOverride:
      oneOf:
      - $ref: '#/components/schemas/StaticOverride'
      - $ref: '#/components/schemas/LoadAtOverride'
      description: One entry in `accountOverrides`. Either a static override (you supply the bytes) or a load-at override (the server reads at a per-account boundary), discriminated by the presence of a `loadAt` field.
    StaticOverride:
      type: object
      description: Customer-supplied account state. Replaces whatever the loader would have produced for this pubkey.
      required:
      - lamports
      - owner
      - data
      properties:
        lamports:
          type: integer
          format: int64
          description: Account lamports.
        owner:
          type: string
          description: Base58 owner program id.
        data:
          type: array
          description: '`[encoded_bytes, encoding]`. `encoding` is `"base64"` or `"base58"`. Decoded data must be ≤ 10 MiB.'
          minItems: 2
          maxItems: 2
          items:
            type: string
        executable:
          type: boolean
          default: false
          description: Whether the account is an executable program.
        rentEpoch:
          type: integer
          format: int64
          description: Rent epoch. Defaults to the rent-exempt sentinel (`2^64 - 1`).
    LoadAtOverride:
      type: object
      description: Per-account positioning. The server loads this account from the archive at the boundary specified by `loadAt`, while the rest of the simulation runs at the request-level position.
      required:
      - loadAt
      properties:
        loadAt:
          $ref: '#/components/schemas/LoadAtSpec'
    LoadAtSpec:
      type: object
      description: Per-account position spec. Set either `slot` (end-of-slot) or `anchor` (per-transaction).
      properties:
        slot:
          type: integer
          format: int64
          description: End-of-slot boundary. Required unless `anchor` is set.
        anchor:
          $ref: '#/components/schemas/Anchor'
    RewindContext:
      type: object
      required:
      - apiVersion
      - slot
      properties:
        apiVersion:
          type: string
          example: rewind-1.2.0
        slot:
          type: integer
          format: int64
          description: The resolved query/load slot.
    SimulateValue:
      type: object
      required:
      - logs
      - unitsConsumed
      - rewindSlot
      - rewindLoadSlot
      properties:
        err:
          type: object
          nullable: true
          additionalProperties: true
          description: '`null` on success; on failure, a structured `TransactionError` matching Solana''s wire shape.'
        logs:
          type: array
          description: Program log stream from execution.
          items:
            type: string
        accounts:
          type: array
          description: Post-state of the addresses listed in `config.accounts.addresses`, in order. Entries the tx didn't touch are emitted as null in the wire format.
          items:
            type: object
            additionalProperties: true
        unitsConsumed:
          type: integer
          format: int64
        returnData:
          type: object
          nullable: true
          additionalProperties: true
          description: Program-emitted return data when set; null otherwise.
        innerInstructions:
          type: array
          description: 'Present when `config.innerInstructions = true`. Each entry: `{ index, instructions[] }` — one per outer instruction that produced inner instructions.'
          items:
            type: object
            additionalProperties: true
        rewindSlot:
          type: integer
          format: int64
          description: Rewind extension. Natural slot used for ALT resolution.
        rewindLoadSlot:
          type: integer
          format: int64
          description: Rewind extension. Slot at which non-ALT account state was loaded; equals `rewindSlot` unless `preStateSlot` overrode it.
        rewindOverriddenAccounts:
          type: array
          description: Rewind extension. Base58 pubkeys for which an `accountOverrides` entry was supplied and successfully applied. Always present; empty when no overrides were requested. A non-empty array means the result is hypothetical, not archive-truthful.
          items:
            type: string
        rewindOverrideLoads:
          type: object
          description: Rewind extension. Map of `pubkey → { loadSlot }` for each `LoadAt` override, reporting the actual slot the engine loaded each per-account override from. `Static` overrides do not appear here. Always present; empty when no `LoadAt` entries were requested.
          additionalProperties:
            type: object
            required:
            - loadSlot
            properties:
              loadSlot:
                type: integer
                format: int64
  responses:
    UnauthorizedError:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    ForbiddenError:
      description: Insufficient permissions for the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    TooManyRequestsError:
      description: Rate limit exceeded for this tier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    InternalServerError:
      description: Unexpected server error. Treat as transient; safe to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
  securitySchemes:
    AuthHeader:
      type: apiKey
      in: header
      name: Authorization
      description: 'Pass `Authorization: <api-key>` on each request.'
    URLParameter:
      type: apiKey
      in: query
      name: api_key
      description: Pass `?api_key=<api-key>` on the URL.
security: *id001
