  /getProgramAccounts:
    post:
      operationId: getProgramAccounts
      summary: getProgramAccounts — All accounts owned by a program
      tags:
      - Account
      description: |
        Returns all accounts owned by a given program. This method is useful for finding all accounts associated with a specific program, such as all token accounts for a particular token mint or all accounts created by a custom program. You can apply filters to narrow down the results. SPL/SPL2022 Token Program Requirements: When querying SPL or SPL2022 token programs, the configuration object must include: filters (array, required): An array of filters to apply to the accounts. Must contain the dataSize filter. Must be one of the known lengths for SPL/SPL2022 program accounts (mint= 82 , token= 165 ) or a larger value when filtering for SPL2022 accounts with extensions. When filtering for multisig accounts, the size must be 355 for accounts of both programs. When filtering for token accounts : Must contain at least one memcmp filter. Only the mint ( offset = 0 , 32 bytes data length) and the owner ( offset = 32 , 32 bytes data length) filters are supported.
        **Parameters**

        0. `programId` (required) — Program pubkey, base-58.
        1. `config` (optional) — Optional configuration object. Every field is optional; omit the entire object to use defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  description: JSON-RPC protocol version.
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  description: Request identifier echoed back in the response.
                  example: 1
                method:
                  type: string
                  enum:
                  - getProgramAccounts
                  description: Must be `getProgramAccounts`.
                  example: getProgramAccounts
                params:
                  type: array
                  description: Positional parameters. Each item below corresponds to one position in the array, in order.
                  minItems: 1
                  maxItems: 2
                  items:
                    anyOf:
                    - title: programId
                      type: string
                      description: Program pubkey, base-58.
                      example: 83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri
                    - title: config (optional)
                      type: object
                      description: Optional configuration object. Every field is optional; omit the entire object to use defaults.
                      properties:
                        commitment:
                          $ref: '#/components/schemas/Commitment'
                        minContextSlot:
                          type: integer
                          format: int64
                          description: Minimum slot at which the request can be evaluated. The RPC node will reject the request with a `MinContextSlotNotReached` error if its current root is below this value. Use this for read-after-write consistency in multi-step workflows.
                          example: 416990000
                        encoding:
                          $ref: '#/components/schemas/Encoding'
                        dataSlice:
                          type: object
                          properties:
                            offset:
                              type: integer
                              format: int64
                            length:
                              type: integer
                              format: int64
                        filters:
                          type: array
                          items:
                            type: object
                            description: A filter that matches accounts whose data length equals `dataSize`, or whose data at `memcmp.offset` equals `memcmp.bytes`. Provide one of the two keys per filter.
                            properties:
                              dataSize:
                                type: integer
                                format: int64
                                description: Exact account data size, in bytes. Match accounts whose data is exactly this many bytes long.
                                example: 165
                              memcmp:
                                type: object
                                description: Match accounts whose data at `offset` equals `bytes` (encoded per `encoding`).
                                properties:
                                  offset:
                                    type: integer
                                    format: int64
                                    description: Byte offset into the account data.
                                    example: 0
                                  bytes:
                                    type: string
                                    description: Bytes to match against, base-58 or base-64.
                                    example: 3Mc6vR
                                  encoding:
                                    type: string
                                    description: Encoding for the `bytes` field.
                                    example: base58
                                    enum:
                                    - base58
                                    - base64
                          description: Optional list of filters. Each filter narrows the result set; the server intersects them. Use `dataSize` to filter by account data length, and `memcmp` to filter by byte-equal at a given offset.
                        withContext:
                          type: boolean
                          description: If true, wrap the response in a `{context, value}` envelope. Default is false (return the array directly).
                          example: true
            examples:
              default:
                summary: Standard request — required params only.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: getProgramAccounts
                  params:
                  - TokenkegQfeZyiNwAJsyFbPVwwQnLjMi6tsmbMrWcbq
                  - encoding: base64
                    filters:
                    - dataSize: 165
              with_filters:
