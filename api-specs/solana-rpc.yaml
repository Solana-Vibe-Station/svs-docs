        ⚠️ WARNING: This RPC method is disabled on Solana Vibe Station mainnet-beta nodes. This method is not available on our infrastructure. Please use alternative faucets for obtaining devnet/testnet SOL: Solana Faucet QuickNode Multi-chain Faucet Solana CLI: solana airdrop 1 Requests an airdrop of lamports to a specified Pubkey.
        **Parameters**

        0. `pubkey` (required) — Base-58 encoded public key.
        1. `lamports` (required) — Lamports to airdrop.
        2. `config` (optional) — Optional configuration object. Every field is optional; omit the entire object to use defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  description: JSON-RPC protocol version.
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  description: Request identifier echoed back in the response.
                  example: 1
                method:
                  type: string
                  enum:
                  - requestAirdrop
                  description: Must be `requestAirdrop`.
                  example: requestAirdrop
                params:
                  type: array
                  description: Positional parameters. Each item below corresponds to one position in the array, in order.
                  minItems: 2
                  maxItems: 3
                  items:
                    anyOf:
                    - title: pubkey
                      type: string
                      description: Base-58 encoded public key.
                      example: 83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri
                    - title: lamports
                      type: integer
                      format: int64
                      example: 1000000000
                    - title: config (optional)
                      type: object
                      description: Optional configuration object. Every field is optional; omit the entire object to use defaults.
                      properties:
                        commitment:
                          $ref: '#/components/schemas/Commitment'
                        minContextSlot:
                          type: integer
                          format: int64
                          description: Minimum slot at which the request can be evaluated. The RPC node will reject the request with a `MinContextSlotNotReached` error if its current root is below this value. Use this for read-after-write consistency in multi-step workflows.
