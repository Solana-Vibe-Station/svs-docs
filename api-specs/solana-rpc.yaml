                      type: array
                      items:
                        type: string
                        description: Account pubkey, base-58.
                        example: 83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri
                      description: Pubkeys to query, max 100 per request. Order is preserved in the response.
