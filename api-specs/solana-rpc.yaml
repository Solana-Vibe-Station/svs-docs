    post:
      operationId: sendTransaction
      summary: sendTransaction — Submit a signed transaction
      tags:
      - Transactions
      description: |
        Submits a signed transaction to the cluster for processing and returns the transaction signature if successful. This is the primary method for executing transactions on the Solana network. The transaction must be fully signed and serialized before submission. The method provides various options for controlling transaction processing behavior, including preflight checks, retry logic, and encoding formats. Transactions that fail preflight checks or network validation will return detailed error information.
        **Parameters**

        0. `transaction` (required) — Fully-signed transaction encoded per the chosen `encoding` (base-58 by default, base-64 recommended).
        1. `config` (optional) — Optional configuration object. Every field is optional; omit the entire object to use defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  description: JSON-RPC protocol version.
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  description: Request identifier echoed back in the response.
                  example: 1
                method:
                  type: string
                  enum:
                  - sendTransaction
                  description: Must be `sendTransaction`.
                  example: sendTransaction
                params:
                  type: array
                  description: Positional parameters. Each item below corresponds to one position in the array, in order.
                  minItems: 1
                  maxItems: 2
                  items:
                    anyOf:
                    - title: transaction
                      type: string
                      description: Fully-signed encoded transaction.
                      example: 4hXTCkRzt9WyecNzV1XPgCDfGAZzQKNxLXgynz5QDuWWPSAZBZSHptvWRL3BjCvzUXRdKvHL2b7yGrRQcWyaqsa
                    - title: config (optional)
                      type: object
                      description: Optional configuration object. Every field is optional; omit the entire object to use defaults.
                      properties:
                        commitment:
                          $ref: '#/components/schemas/Commitment'
                        minContextSlot:
                          type: integer
                          format: int64
                          description: Minimum slot at which the request can be evaluated. The RPC node will reject the request with a `MinContextSlotNotReached` error if its current root is below this value. Use this for read-after-write consistency in multi-step workflows.
                          example: 416990000
                        skipPreflight:
                          type: boolean
                          description: If true, skip the preflight transaction simulation that verifies signature, blockhash, and account state before submission. Default false.
                          example: false
                          default: false
                        preflightCommitment:
                          $ref: '#/components/schemas/Commitment'
                        encoding:
                          $ref: '#/components/schemas/Encoding'
                        maxRetries:
                          type: integer
                          format: int64
                          description: Maximum number of retries when forwarding to the leader. Default unlimited (until blockhash expires).
                          example: 0
            examples:
