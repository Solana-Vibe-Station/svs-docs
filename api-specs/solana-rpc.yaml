                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  description: JSON-RPC protocol version.
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  description: Request identifier echoed back in the response.
                  example: 1
                method:
                  type: string
                  enum:
                  - getRecentPrioritizationFees
                  description: Must be `getRecentPrioritizationFees`.
                  example: getRecentPrioritizationFees
                params:
                  type: array
                  description: Positional parameters. Each item below corresponds to one position in the array, in order.
                  minItems: 0
                  maxItems: 1
                  items:
                    anyOf:
                    - title: addresses (optional)
