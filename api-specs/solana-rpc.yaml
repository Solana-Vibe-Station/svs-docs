                        description: Account pubkey, base-58.
                        example: 83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri
                      description: Account pubkeys (max 128). Omit or pass an empty array for cluster-wide stats.
            examples:
              default:
                summary: Standard request — required params only.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: getRecentPrioritizationFees
                  params:
                  - - 83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri
