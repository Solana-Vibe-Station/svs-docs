                summary: Standard request — required params only.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: sendTransaction
                  params:
                  - 4hXTCkRzt9WyecNzV1XPgCDfGAZzQKNxLXgynz5QDuWWPSAZBZSHptvWRL3BjCvzUXRdKvHL2b7yGrRQcWyaqsa
                  - skipPreflight: false
                    preflightCommitment: processed
              skip_preflight:
                summary: Skip preflight simulation when you trust the transaction (saves latency).
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: sendTransaction
                  params:
                  - 4hXTCkRzt9WyecNzV1XPgCDfGAZzQKNxLXgynz5QDuWWPSAZBZSHptvWRL3BjCvzUXRdKvHL2b7yGrRQcWyaqsa
                  - skipPreflight: true
      responses:
        '200':
          description: Successful `sendTransaction` response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonRpcEnvelope'
