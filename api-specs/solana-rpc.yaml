  /getFeeForMessage:
    post:
      operationId: getFeeForMessage
      summary: getFeeForMessage — Estimate fee for a message
      tags:
      - Fees
      description: |
        Get the fee the network will charge for a particular Message. Version Restriction : This method is only available in solana-core v1.9 or newer. Please use getFees for solana-core v1.8 and below.
        **Parameters**

        0. `message` (required) — Base-64 encoded compiled transaction message (the `Message`, not a full transaction). Used by `getFeeForMessage`.
        1. `config` (optional) — Optional configuration object. Every field is optional; omit the entire object to use defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  description: JSON-RPC protocol version.
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  description: Request identifier echoed back in the response.
                  example: 1
                method:
                  type: string
                  enum:
                  - getFeeForMessage
                  description: Must be `getFeeForMessage`.
                  example: getFeeForMessage
                params:
                  type: array
                  description: Positional parameters. Each item below corresponds to one position in the array, in order.
                  minItems: 1
                  maxItems: 2
                  items:
                    anyOf:
                    - title: message
                      type: string
                      description: Base-64 encoded compiled message.
                      example: AQABA0PJ8nGUKkR2lKZ8VcWQYWQzTGYYNCPdjhq2WaqLNUowVnPB6Q==
                    - title: config (optional)
                      type: object
                      description: Optional configuration object. Every field is optional; omit the entire object to use defaults.
                      properties:
                        commitment:
                          $ref: '#/components/schemas/Commitment'
                        minContextSlot:
                          type: integer
                          format: int64
                          description: Minimum slot at which the request can be evaluated. The RPC node will reject the request with a `MinContextSlotNotReached` error if its current root is below this value. Use this for read-after-write consistency in multi-step workflows.
                          example: 416990000
            examples:
              default:
                summary: Standard request — required params only.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: getFeeForMessage
                  params:
                  - AQABA0PJ8nGUKkR2lKZ8VcWQYWQzTGYYNCPdjhq2WaqLNUowVnPB6Q==
                  - commitment: processed
      responses:
        '200':
          description: Successful `getFeeForMessage` response.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonRpcEnvelope'
                - type: object
                  required:
                  - result
                  properties:
                    result:
                      type: object
                      required:
                      - context
                      - value
                      properties:
                        context:
                          $ref: '#/components/schemas/Context'
                        value:
                          type: integer
                          format: int64
                          description: Fee in lamports, or null if message could not be decoded.
                          nullable: true
              example:
                jsonrpc: '2.0'
                id: 1
                result:
                  context:
                    slot: 416997240
                    apiVersion: 3.1.10
                  value: 5000
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
      security: *id005
      x-codeSamples:
      - lang: shell
        label: cURL
        source: |-
          curl -X POST https://public.rpc.solanavibestation.com \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"getFeeForMessage","params":["AQABA0PJ8nGUKkR2lKZ8VcWQYWQzTGYYNCPdjhq2WaqLNUowVnPB6Q==",{"commitment":"processed"}]}'
      - lang: python
        label: Python
        source: |-
          from solana.rpc.api import Client
          from solders.pubkey import Pubkey

          client = Client("https://public.rpc.solanavibestation.com")

          # `message` is a base-64 encoded compiled Message (not a full Transaction).
          from solders.message import to_bytes_versioned
          import base64
          # msg_bytes = to_bytes_versioned(my_versioned_message)
          # encoded = base64.b64encode(msg_bytes).decode()
          encoded = "AQABA0PJ8nGUKkR2lKZ8VcWQYWQzTGYYNCPdjhq2WaqLNUowVnPB6Q=="
          resp = client.get_fee_for_message(encoded)
          print(resp.value, "lamports")
      - lang: javascript
        label: JavaScript
        source: |-
          import { Connection, PublicKey } from "@solana/web3.js";

          const connection = new Connection("https://public.rpc.solanavibestation.com", "confirmed");

          // `message` is the compiled Message of your transaction.
          // const { value: fee } = await connection.getFeeForMessage(transaction.compileMessage());
          const encoded = "AQABA0PJ8nGUKkR2lKZ8VcWQYWQzTGYYNCPdjhq2WaqLNUowVnPB6Q==";
          const r = await fetch("https://public.rpc.solanavibestation.com", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "getFeeForMessage", params: [encoded] }),
          });
          console.log((await r.json()).result);
      - lang: rust
        label: Rust
        source: |-
          use solana_client::rpc_client::RpcClient;
          use solana_sdk::pubkey::Pubkey;
          use std::str::FromStr;

          let client = RpcClient::new("https://public.rpc.solanavibestation.com".to_string());

          // In production, build a Message with solana_sdk::message::Message and call:
          //   client.get_fee_for_message(&my_message)?
          // Here we show the equivalent raw JSON-RPC call:
          let body = serde_json::json!({
              "jsonrpc": "2.0", "id": 1, "method": "getFeeForMessage",
              "params": ["AQABA0PJ8nGUKkR2lKZ8VcWQYWQzTGYYNCPdjhq2WaqLNUowVnPB6Q=="]
          });
          let resp: serde_json::Value = reqwest::blocking::Client::new()
              .post("https://public.rpc.solanavibestation.com").json(&body).send()?.json()?;
