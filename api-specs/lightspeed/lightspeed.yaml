openapi: 3.0.3
info:
  title: 'Lightspeed: /lightspeed'
  description: |-
    Lightspeed is the SVS low-latency transaction landing service. Sending a `sendTransaction` JSON-RPC request to the `/lightspeed` path on any tier endpoint forwards the signed transaction through SVS's Lightspeed engine, which races it across multiple upstream peers based on the included tip.

    A minimum tip of **0.001 SOL (1,000,000 lamports)** is required: the transaction must include a system-program transfer instruction sending at least that amount to a Lightspeed tip address. Two kinds of tip destinations are accepted:

    - **Static tip address** — the well-known, always-valid address `svsMoWJBwLcs8JgfN8VaF111tAc199KpYeTKRwxRtip`. Only needs to meet the route minimum.
    - **Stealth dynamic tip addresses** — one-time-use addresses fetched at runtime from [`GET /lightspeed/fetchtipaddress`](/api-specs/lightspeed/fetchTipAddress.yaml). Each address is unique (never issued to anyone else, ever) and accepted on **every** Lightspeed edge in every region the instant it is issued. Because they are unpredictable and reused nowhere, dynamic tips are much harder for on-chain observers to fingerprint as Lightspeed submissions. Dynamic addresses must receive **≥ `min_lamports`** (currently `890880`, the rent-exempt floor for a new account) **and** the route minimum.

    The request must also set `skipPreflight: true` and the transaction must be fully signed and serialized.

    Use `getHealth` against the same tier endpoint to keep the connection alive when idle.
  version: 1.0.0
  contact:
    name: Solana Vibe Station
    url: https://www.solanavibestation.com
  license:
    name: MIT OR Apache-2.0
    url: https://opensource.org/licenses/MIT
