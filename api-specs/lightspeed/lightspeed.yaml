tags:
- name: Lightspeed
  description: Low-latency transaction landing via the SVS Lightspeed engine.
paths:
  /lightspeed:
    post:
      operationId: lightspeedSendTransaction
      summary: sendTransaction — Submit a signed transaction via Lightspeed
      tags:
      - Lightspeed
      description: |
        Submits a signed transaction with priority processing through the Lightspeed validator network. Provides accelerated landing through a tip-based priority system.

        **Requirements**

        1. The transaction must include a **top-level `System::Transfer`** instruction (program `11111111111111111111111111111111`) whose destination is a Lightspeed tip address in the transaction's static account keys. CPI transfers and destinations resolved through an address-lookup table are **not** detected and will be rejected.
        2. The tipping transfer must meet the route minimum (**≥ 0.001 SOL / 1,000,000 lamports**). If tipping a **dynamic** address, it must also meet `min_lamports` (currently 890,880 — the rent-exempt floor for a new account).
        3. The first qualifying transfer in instruction order is the one recorded.
        4. The configuration object **must** set `skipPreflight: true`.
        5. The transaction must be fully signed and serialized (base58 or base64).

        **Lightspeed tip addresses**

        - **Static** (always valid, no fetch required): `svsMoWJBwLcs8JgfN8VaF111tAc199KpYeTKRwxRtip`
        - **Stealth dynamic** (recommended for maximum landing performance and on-chain unpredictability): fetch via `GET /lightspeed/fetchtipaddress`. Dynamic addresses are single-holder, time-boxed, and accepted on every edge the instant they are issued. A held address may be reused by its holder any number of times until `expires_at`. Discover the ladder of available TTLs and current quota via `GET /lightspeed/tipinfo`.

        **Selecting upstreams (optional)**

        By default the transaction fans out to every upstream configured for this tier. To restrict it to a subset, pass an allow-list either as the `?only=` query parameter or as `params[1].onlyUpstreams` in the body (or both — they combine). Names are case-insensitive and operator-defined per tier; `jito` always refers to the Jito bundle forward where it is enabled, so **omit `jito`** to opt out of Jito forwarding.

        - `?only=swqos` — send only to the `swqos` upstream.
        - `?only=swqos,jito` — send only to `swqos` and `jito`.
        - `params[1].onlyUpstreams: ["swqos"]` — same, as a body field.

        An unknown name returns `400 Unknown upstream name` (the error lists the selectable names for this tier). The list must leave at least one fan-out upstream — the built-in `jito` forward alone cannot answer a `sendTransaction`.

        **Keep-alive:** issue periodic `getHealth` calls to the same tier endpoint to maintain your connection.
      parameters:
      - name: only
        in: query
        required: false
        description: 'Comma-separated allow-list of upstream names to send to (case-insensitive). Combines with `params[1].onlyUpstreams` if both are set. An unknown name returns `400 Unknown upstream name`. Omit `jito` to opt out of Jito forwarding.'
        schema:
          type: string
        example: swqos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  description: JSON-RPC protocol version.
                  example: '2.0'
                id:
                  oneOf:
                  - type: string
                  - type: integer
                  description: Request identifier echoed back in the response.
                  example: 1
                method:
                  type: string
                  enum:
                  - sendTransaction
                  description: Must be `sendTransaction`.
                  example: sendTransaction
                params:
                  type: array
                  description: 'Positional parameters: [signed transaction (base58/base64 string), config object].'
                  minItems: 2
                  maxItems: 2
                  items:
                    anyOf:
                    - title: signed_transaction
                      type: string
                      description: Fully signed and serialized transaction containing your instructions plus a top-level `System::Transfer` to a Lightspeed tip address — either the static address `svsMoWJBwLcs8JgfN8VaF111tAc199KpYeTKRwxRtip` or a dynamic address fetched from `/lightspeed/fetchtipaddress`. Base58 or base64 encoded.
                    - title: config
                      type: object
                      required:
                      - skipPreflight
                      properties:
                        encoding:
                          type: string
                          enum:
                          - base58
                          - base64
                          default: base58
                          description: Encoding of the transaction string in the first param.
                        skipPreflight:
                          type: boolean
                          enum:
                          - true
                          description: Must be `true` for Lightspeed.
                        maxRetries:
                          type: integer
                          format: int32
                          minimum: 0
                          description: Maximum number of times the RPC node will retry sending the transaction. Set to `0` to disable retries.
                          example: 0
                        preflightCommitment:
                          $ref: '#/components/schemas/Commitment'
                        minContextSlot:
                          type: integer
                          format: int64
                        onlyUpstreams:
                          description: |
                            Optional allow-list of upstream names (case-insensitive) — send this transaction **only** to these upstreams. May be an array or a comma-separated string; combines with the `?only=` query. This field is Lightspeed's, not Solana's, and is stripped before forwarding so upstreams never see it. Omit `jito` to opt out of Jito forwarding. Same `400`s as `?only=`.
                          oneOf:
                          - type: array
                            items:
                              type: string
                            example:
                            - swqos
                          - type: string
                            example: swqos
            examples:
              default:
                summary: Standard Lightspeed sendTransaction request.
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: sendTransaction
                  params:
                  - 4hXTCkRzt9WyecNzV1XPgCDfGAZzQKNxLXgynz5QDuWWPSAZBZSHptvWRL3BjCvzUXRdKvHL2b7yGrRQcWyaqsaBCncVG7BFggS8w9snUts67BSh3EqKpXLUm5UMHfD7ZBe9GhARjbNQMLJ1QD3Spr6REFY9Vw6y4jTvVwjNyKjFg0G5rucCjJ9a2Cf3sKKkgJfS2dWWEJB6gq7s7wSQ4gZzJYBHDnQ8sSg9a9kGKKz6Dcs
                  - encoding: base58
                    skipPreflight: true
                    maxRetries: 0
      responses:
        '200':
          description: Transaction accepted; returns the transaction signature.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonRpcEnvelope'
                - type: object
                  required:
                  - result
                  properties:
                    result:
                      type: string
                      description: Base-58 transaction signature. Use this to track status via `getSignatureStatuses` or `getTransaction`.
                      pattern: '^[1-9A-HJ-NP-Za-km-z]{87,88}$'
              example:
                jsonrpc: '2.0'
                id: 1
                result: 2id3YC2jK9G5Wb2GmXYhqJqhb5S1n9mfK8ydGT6YWq9DJNWjPvAo1e5uDYKKxe8Y2k1Vp4nUJGHG9xEJT1m4F9G
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: &id001
      - AuthHeader: []
      - URLParameter: []
      x-codeSamples:
      - lang: shell
        label: cURL
        source: |-
          curl -X POST https://basic.swqos.solanavibestation.com/lightspeed \
            -H "Content-Type: application/json" \
            -H "Authorization: your-api-key-here" \
            -d '{
              "jsonrpc": "2.0",
              "id": 1,
              "method": "sendTransaction",
              "params": [
                "<SIGNED_TX_BASE58>",
                {
                  "encoding": "base58",
                  "skipPreflight": true,
                  "maxRetries": 0
                }
              ]
            }'
      - lang: javascript
        label: JavaScript
        source: |-
          import { Connection } from "@solana/web3.js";

          // Point Connection at the /lightspeed path on any tier endpoint.
          const connection = new Connection(
            "https://basic.swqos.solanavibestation.com/lightspeed",
            "confirmed",
          );

          // signedTx is a Buffer containing your fully signed transaction
          // including a 0.001 SOL transfer to a Lightspeed tip address.
          const sig = await connection.sendRawTransaction(signedTx, {
            skipPreflight: true,
            maxRetries: 0,
          });
          console.log(`signature=${sig}`);
      - lang: python
        label: Python
        source: |-
          from solana.rpc.api import Client
          from solana.rpc.types import TxOpts

          # Point the Client at the /lightspeed path on any tier endpoint.
          client = Client("https://basic.swqos.solanavibestation.com/lightspeed")

          # signed_tx is the fully signed transaction including a 0.001 SOL
          # transfer to a Lightspeed tip address.
          resp = client.send_raw_transaction(
              bytes(signed_tx),
              opts=TxOpts(skip_preflight=True, max_retries=0),
          )
          print(f"signature={resp.value}")
      - lang: rust
        label: Rust
        source: |-
          use solana_client::rpc_client::RpcClient;
          use solana_client::rpc_config::RpcSendTransactionConfig;
          use solana_sdk::commitment_config::CommitmentConfig;

          // Point the RpcClient at the /lightspeed path on any tier endpoint.
          let client = RpcClient::new_with_commitment(
              "https://basic.swqos.solanavibestation.com/lightspeed".to_string(),
              CommitmentConfig::confirmed(),
          );

          // signed_tx is your fully signed Transaction including a 0.001 SOL
          // transfer to a Lightspeed tip address.
          let sig = client.send_transaction_with_config(
              &signed_tx,
              RpcSendTransactionConfig {
                  skip_preflight: true,
                  max_retries: Some(0),
                  ..Default::default()
              },
          )?;
          println!("signature={}", sig);
components:
  schemas:
    JsonRpcEnvelope:
      type: object
      required:
      - jsonrpc
      - id
      description: Base envelope of every JSON-RPC 2.0 response.
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
          example: '2.0'
        id:
          oneOf:
          - type: string
          - type: integer
          description: Echoed request id.
          example: 1
    JsonRpcErrorResponse:
      type: object
      required:
      - jsonrpc
      - id
      - error
      description: JSON-RPC 2.0 error response.
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: string
          - type: integer
        error:
          $ref: '#/components/schemas/JsonRpcError'
    JsonRpcError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: |
            JSON-RPC error code. Common values:
            - `-32700` Parse error
            - `-32600` Invalid Request
            - `-32602` Invalid params
            - `-32603` Internal error
            - `-32003` Unauthorized (missing/invalid API key)
            - `-32005` Too Many Requests
          example: -32602
        message:
          type: string
          example: Invalid params
        data:
          type: object
          additionalProperties: true
    Commitment:
      type: string
      enum:
      - processed
      - confirmed
      - finalized
      default: finalized
      description: |-
        How finalized a block is at query time:
        - `processed`: most recent block, may be skipped
        - `confirmed`: confirmed by supermajority
        - `finalized`: finalized by >2/3 stake
  responses:
    UnauthorizedError:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    ForbiddenError:
      description: Insufficient permissions for the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    TooManyRequestsError:
      description: Rate limit exceeded for this tier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcErrorResponse'
  securitySchemes:
    AuthHeader:
      type: apiKey
      in: header
      name: Authorization
      description: 'Pass `Authorization: <api-key>` on each request.'
    URLParameter:
      type: apiKey
      in: query
      name: api_key
      description: Pass `?api_key=<api-key>` on the URL.
security: *id001
