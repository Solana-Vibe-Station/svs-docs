name: Validate OpenAPI Specs

on:
  push:
    paths:
      - 'api-specs/**'
  pull_request:
    paths:
      - 'api-specs/**'

jobs:
  validate:
    name: Validate OpenAPI Specifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Validate SVS API spec
        run: redocly lint api-specs/svs-api.yaml --skip-rule no-unused-components

      - name: Validate per-method Solana RPC specs
        run: |
          fail=0
          for f in api-specs/solana-rpc/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Validate per-method Historical RPC specs
        run: |
          fail=0
          for f in api-specs/historical/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Validate per-method WebSocket RPC specs
        run: |
          fail=0
          for f in api-specs/websocket-rpc/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Validate Lightspeed spec
        run: |
          fail=0
          for f in api-specs/lightspeed/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Validate Jito specs
        run: |
          fail=0
          for f in api-specs/jito/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Validate Rewind specs
        run: |
          fail=0
          for f in api-specs/rewind/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Summary
        if: always()
        run: |
          echo "## OpenAPI Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Spec layout: one OpenAPI 3.0 file per JSON-RPC method." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Group | Files |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| SVS API (REST) | $(ls api-specs/svs-api.yaml 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Solana RPC (HTTP) | $(ls api-specs/solana-rpc/*.yaml 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Historical RPC | $(ls api-specs/historical/*.yaml 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| WebSocket RPC | $(ls api-specs/websocket-rpc/*.yaml 2>/