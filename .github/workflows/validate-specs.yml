name: Validate OpenAPI Specs

on:
  push:
    paths:
      - 'api-specs/**'
  pull_request:
    paths:
      - 'api-specs/**'

jobs:
  validate:
    name: Validate OpenAPI Specifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Validate SVS API spec
        run: redocly lint api-specs/svs-api.yaml --skip-rule no-unused-components

      - name: Validate per-method Solana RPC specs
        run: |
          fail=0
          for f in api-specs/solana-rpc/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Validate per-method Historical RPC specs
        run: |
          fail=0
          for f in api-specs/historical/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Validate per-method WebSocket RPC specs
        run: |
          fail=0
          for f in api-specs/websocket-rpc/*.yaml; do
            echo "=== $f ==="
            redocly lint "$f" --skip-rule no-unused-components || fail=1
          done
          exit "$fail"

      - name: Summar